name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

on: [workflow_call, workflow_dispatch]

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  create_certs:
    name: Certificates
    needs: validate
    runs-on: macos-26-intel
    outputs:
      new_certificate_needed: ${{ steps.set_output.outputs.new_certificate_needed }}

    steps:
      # Check out repository
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Preserve the existing Fastlane Match table workaround
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Install Project Dependencies
        run: bundle install

      # Preserve clock synchronization workaround
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      # Fail immediately on invalid stored signing assets.
      # The Fastfile's check_and_renew_certificates lane validates Match-Secrets.
      - name: Check Distribution certificate and signing assets
        id: check_certs
        run: |
          set -euo pipefail
          bundle exec fastlane check_and_renew_certificates

      # Only runs if the signing assets check succeeds.
      # Do not suppress failures from Fastlane.
      - name: Check and create or update Distribution certificate and profiles if needed
        run: |
          set -euo pipefail
          echo "Running Fastlane certs lane..."
          bundle exec fastlane certs

      - name: Set output and annotations based on Fastlane result
        id: set_output
        run: |
          set -euo pipefail
          CERT_STATUS_FILE="${{ github.workspace }}/fastlane/new_certificate_needed.txt"
          if [ -f "$CERT_STATUS_FILE" ]; then
            CERT_STATUS=$(tr -d '\n\r' < "$CERT_STATUS_FILE")
            echo "new_certificate_needed: $CERT_STATUS"
            echo "new_certificate_needed=$CERT_STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Certificate status file not found. Defaulting to false."
            echo "new_certificate_needed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::Automatic certificate revocation is disabled in this workflow."

  # Intentionally no nuke_certs job. Revocation can invalidate certificates
  # and profiles used by Loop, Follow, Caregiver, or other apps.
